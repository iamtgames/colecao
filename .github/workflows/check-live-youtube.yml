name: Checar canais ao vivo (YouTube)

on:
  schedule:
    - cron: '7 1-16/3 * * *'
    - cron: '7 20,21,22,23,0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: canais-live-json

jobs:
  checar-live-youtube:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Execucoes agendadas respeitam o intervalo minimo do check-live.js (cota).
      # Execucao manual (workflow_dispatch) forca a checagem completa do YouTube.
      - name: Checar canais ao vivo e gerar canais_live.json
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          SKIP_TWITCH: '1'
          FORCE_YOUTUBE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: node check-live.js

      - name: Commitar mudancas (se houver)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add canais_live.json
          if git diff --staged --quiet; then
            echo "Sem mudancas pra commitar."
            exit 0
          fi
          git commit -m "Atualiza status de lives (automatico)"
          for i in 1 2 3 4 5; do
            # -X theirs: num conflito, vale o nosso canais_live.json recem-gerado.
            if git pull --rebase -X theirs origin main && git push; then
              exit 0
            fi
            echo "Push falhou (tentativa $i) -- tentando de novo."
            git rebase --abort 2>/dev/null || true
            sleep $((i * 4))
          done
          echo "Nao foi possivel enviar o commit depois de 5 tentativas."
          exit 1
